name: Assemble production manifest

on:
  push:
    branches: [main]
    paths:
      - 'production-build/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble manifest
        shell: bash
        run: |
          cat production-build/manifest.part* > production/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('production/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('channel')=='production'
          assert d.get('version')=='1.24.0'
          assert isinstance(d.get('replacements'), list) and d['replacements']
          print('manifest ok', d['version'], len(d['replacements']))
          PY
      - name: Commit production manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/manifest.json
          if git diff --cached --quiet; then
            echo 'No manifest change'
          else
            git commit -m 'Publish LITTO 1.24.0 production manifest'
            git push
          fi
