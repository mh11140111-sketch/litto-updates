name: Publish LITTO 1.24.0 manifest

on:
  push:
    branches: [main]
    paths:
      - 'production-safe/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble manifest
        shell: bash
        run: |
          cat production-safe/manifest.part* > production/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('production/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('channel') == 'production'
          assert d.get('version') == '1.24.0'
          assert isinstance(d.get('replacements'), list) and d['replacements']
          print('validated', d['version'], len(d['replacements']))
          PY
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/manifest.json
          git commit -m 'Publish LITTO 1.24.0 production manifest'
          git push
