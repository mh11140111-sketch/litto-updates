name: Publish LITTO 1.24.0 safe
on:
  push:
    paths:
      - '.github/workflows/publish-litto-124-safe.yml'
      - 'production-safe-xz-v124/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild safe production manifest
        shell: bash
        run: |
          set -euo pipefail
          cat production-safe-xz-v124/part01.txt production-safe-xz-v124/part02.txt production-safe-xz-v124/part03.txt production-safe-xz-v124/part04.txt > /tmp/manifest.xz.b64
          base64 -d /tmp/manifest.xz.b64 > /tmp/manifest.xz
          xz -dc /tmp/manifest.xz > production/manifest.json
          python - <<'PY'
          import json
          p='production/manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('channel')=='production'
          assert d.get('version')=='1.24.0'
          s=open(p,encoding='utf-8').read()
          for bad in ('15:00:00','15:10:00','15:19:00','/api/order/place','order_type','자동매매 시작'):
              assert bad not in s, bad
          print('validated replacements:',len(d.get('replacements',[])))
          PY
      - name: Commit production manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LITTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add production/manifest.json
          if git diff --cached --quiet; then
            echo 'No production manifest change.'
            exit 0
          fi
          git commit -m 'Publish LITTO 1.24.0 safe production update'
          git push
